spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        url: http://localhost:9090
        instance:
          service-base-url: http://localhost:80
  datasource:
    url: jdbc:postgresql://discodeit.crg0gyeyahwe.ap-northeast-2.rds.amazonaws.com:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
